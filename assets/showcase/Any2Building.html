<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Any2Building — Interactive comparisons</title><link rel="stylesheet" href="../../styles.css?v=20261122"><script type="module" src="viewer.js"></script></head><body class="standalone-viewer"><main><section id="interactive" class="viewer-section wide section" aria-labelledby="interactive-title" aria-busy="true">
      <h2 id="interactive-title">Interactive comparisons</h2>
      <p id="viewer-loading" class="viewer-loading" role="status">Loading interactive results…</p>
      <nav id="modules" class="result-tabs" aria-label="Dataset"></nav>
      <nav id="tasks" class="result-tabs" aria-label="Observation setting"></nav>
      <h3 id="heading" class="visually-hidden" aria-live="polite"></h3>
      <div class="filters">
        <div class="filter-group"><span>Building</span><div id="cases" class="group"></div></div>
        <div class="filter-group"><span>Compare with</span><div id="methods" class="group"></div></div>
      </div>
      <div class="stage"><div id="refs" class="refs"></div><div id="ours" class="card ours"></div><div id="other" class="card"></div></div>
      <div class="viewer-foot"><span>Drag to rotate · Scroll to zoom</span><button type="button" id="reset" class="tab-button">Reset view</button></div>
    </section></main></body></html>
